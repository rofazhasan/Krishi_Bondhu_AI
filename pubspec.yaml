name: krishi_bondhu_ai
description: "কৃষি বন্ধু AI - A production-grade visual agricultural officer app for Bangladeshi farmers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management & Dependency Injection
  flutter_riverpod: ^2.5.1
  
  # Navigation & Routing
  go_router: ^14.2.0
  
  # Database Storage
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  
  # Media & Hardware Inputs (Both Camera and Image Selector for user choices)
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.2.0
  
  # Bangla Voice Feedback
  flutter_tts: ^4.1.0
  
  # Theme and Font
  google_fonts: ^6.2.0
  flutter_animate: ^4.5.0
  
  # Unique Identifiers
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
